services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: artha
      MYSQL_USER: artha
      MYSQL_PASSWORD: artha
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/sql/02-test-db.sql:/docker-entrypoint-initdb.d/02-test-db.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uartha", "-partha"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    # No host port: the backend reaches redis over the compose network.
    # (A local dev Redis often already owns 6379 on the host.)
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      ARTHA_DATABASE_URL: mysql://artha:artha@mysql:3306/artha
      ARTHA_DATA_DIR: /app/seed-data
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ARTHA_LLM_PROVIDER: ${ARTHA_LLM_PROVIDER:-}
      ARTHA_REDIS_URL: redis://redis:6379/0
      ARTHA_QUERY_CACHE: "1"
      ARTHA_QUERY_CACHE_TTL: "300"
      # Semantic knowledge layer (RAG over mounted docs).
      ARTHA_KNOWLEDGE_ENABLED: "1"
      ARTHA_KNOWLEDGE_DATA_DIR: /app/knowledge-data
      ARTHA_CHROMA_PERSIST_DIR: /app/knowledge-store
    volumes:
      # Official TBX-provided dataset (20k transactions, 1,000 accounts).
      - ./dataset:/app/seed-data:ro
      - ./knowledge:/app/knowledge-data:ro
      - knowledge_store:/app/knowledge-store
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python scripts/load_data.py --data-dir /app/seed-data --database-url mysql://artha:artha@mysql:3306/artha &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  mysql_data:
  knowledge_store:
