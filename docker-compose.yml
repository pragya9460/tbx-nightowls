services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      ARTHA_DUCKDB_PATH: /app/data/finance.duckdb
      ARTHA_DATA_DIR: /app/seed-data
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ARTHA_LLM_PROVIDER: ${ARTHA_LLM_PROVIDER:-}
      ARTHA_REDIS_URL: redis://redis:6379/0
      ARTHA_QUERY_CACHE: "1"
      ARTHA_QUERY_CACHE_TTL: "300"
    volumes:
      - duckdb_data:/app/data
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    command: >
      sh -c "python scripts/load_data.py --generate --data-dir /app/seed-data --duckdb-path /app/data/finance.duckdb &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  duckdb_data:
